name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26.4'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Run golangci-lint
        run: |
          # Install a pinned v1.x directly instead of golangci-lint-action, whose
          # `version` resolves to golangci-lint v2 — v2 can't load this repo's
          # v1-format .golangci.yml (fails with exit code 3).
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false

  contract-sync:
    name: Contract sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vendored specs match moenet-core & generated types are current
        run: |
          # 1) The vendored contract/*.yaml must match the source of truth in
          #    moenet-core@dev (public repo).
          BASE="https://raw.githubusercontent.com/heichaowo/moenet-core/dev/contract"
          for f in agent-api.openapi.yaml cp-agent-api.openapi.yaml; do
            curl -fsSL "$BASE/$f" -o "/tmp/$f"
            if ! diff -u "contract/$f" "/tmp/$f"; then
              echo "::error::contract/$f drifted from moenet-core@dev — run scripts/sync-contract.sh and commit."
              exit 1
            fi
          done
          # 2) The committed generated types must match those specs.
          go generate ./internal/apicontract/
          if ! git diff --exit-code -- internal/apicontract; then
            echo "::error::Generated contract types are stale — run scripts/sync-contract.sh and commit."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Build
        run: |
          go build -o moenet-agent ./cmd/moenet-agent
          ./moenet-agent -version || true
